name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  console:
    name: Console types, interaction tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npx --yes npm@11.11.0 ci --no-fund
      - run: npm run check
  java:
    name: Unit, PostgreSQL, Kafka, OpenSearch and recovery tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Preserve test and evaluation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-evidence-${{ github.sha }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/evaluation/
            target/validation/
          retention-days: 14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: node scripts/demo.mjs
      - run: npx --yes npm@11.11.0 ci --no-fund
        working-directory: console
      - run: npm run test:integration
        working-directory: console
