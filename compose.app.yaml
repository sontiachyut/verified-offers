# Optional LOCAL volatile packaging smoke test; does not join the durable stack.
services:
  app:
    build: .
    image: verified-offers:local
    command: ["--spring.profiles.active=local-demo", "--server.address=0.0.0.0"]
    ports:
      - "127.0.0.1:8081:8081"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    cpus: 1.5
    mem_limit: 640m
    stop_grace_period: 30s
