spring.application.name=verified-offers
server.address=127.0.0.1
server.port=8081
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.health.db.enabled=false
spring.jackson.deserialization.fail-on-missing-creator-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
server.max-http-request-header-size=16KB
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=128
server.tomcat.accept-count=32
server.tomcat.connection-timeout=5s
server.tomcat.disable-upload-timeout=false
server.tomcat.connection-upload-timeout=10s
